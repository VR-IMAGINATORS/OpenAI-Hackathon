name: Deploy development
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: deploy-development
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate application commit
        id: target
        env:
          REQUESTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REQUESTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          git cat-file -e "$REQUESTED_SHA^{commit}"
          git merge-base --is-ancestor "$REQUESTED_SHA" HEAD
          echo "sha=$REQUESTED_SHA" >> "$GITHUB_OUTPUT"
          git checkout --detach "$REQUESTED_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
      - name: Verify application without deployment credentials
        run: |
          npm ci
          npm run format:check
          npm test
          npm run build
      - name: Build image without deployment credentials
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          docker build --platform linux/amd64 -t "call-to-the-past:$TARGET_SHA" .
          docker save "call-to-the-past:$TARGET_SHA" -o "$RUNNER_TEMP/application-image.tar"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: application-image
          path: ${{ runner.temp }}/application-image.tar
          retention-days: 1
          compression-level: 0
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: development
    permissions:
      contents: read
      id-token: write
    steps:
      # Use this workflow's main commit, never the requested historical application SHA.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: application-image
          path: ${{ runner.temp }}/application-image
      - name: Load prebuilt image (do not run application code)
        run: docker load --input "$RUNNER_TEMP/application-image/application-image.tar"
      - name: Install pinned AWS CLI and Lightsail plugin
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location https://awscli.amazonaws.com/awscli-exe-linux-x86_64-2.36.44.zip -o awscli.zip
          echo '617845f42577b8c1deba29eb5195ced529ee98241ccf4dad922745a287722af4  awscli.zip' | sha256sum --check --status
          unzip -q awscli.zip -d pinned-aws
          sudo ./pinned-aws/aws/install --update
          curl --fail --silent --show-error --location https://github.com/aws/lightsailctl/releases/download/v1.0.8/lightsailctl_1.0.8_linux_amd64.tar.gz -o lightsailctl.tar.gz
          echo '73108f256907306ddd7fc90ff9209b8e9b256a14586c31d63222b4f58281d146  lightsailctl.tar.gz' | sha256sum --check --status
          mkdir pinned-lightsail
          tar -xzf lightsailctl.tar.gz -C pinned-lightsail
          sudo install -m 0755 pinned-lightsail/lightsailctl /usr/local/bin/lightsailctl
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: github-development-${{ github.run_id }}
          mask-aws-account-id: true
      - name: Drain, deploy, and verify
        env:
          DEPLOY_SHA: ${{ needs.build.outputs.sha }}
          LIGHTSAIL_SERVICE_NAME: ${{ vars.LIGHTSAIL_SERVICE_NAME }}
          PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL }}
          INITIAL_DEPLOYMENT: ${{ vars.INITIAL_DEPLOYMENT }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          APP_PASSPHRASE: ${{ secrets.APP_PASSPHRASE }}
          OPS_TOKEN: ${{ secrets.OPS_TOKEN }}
          AI_GLOBAL_LIVE_ATTEMPTS: ${{ vars.AI_GLOBAL_LIVE_ATTEMPTS }}
          AI_GLOBAL_RESPONSE_ATTEMPTS: ${{ vars.AI_GLOBAL_RESPONSE_ATTEMPTS }}
          LIVE_MODEL: ${{ vars.LIVE_MODEL }}
          RESPONSE_MODEL: ${{ vars.RESPONSE_MODEL }}
        run: node --experimental-strip-types tools/deploy.ts
